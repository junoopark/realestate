<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%230b2447%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 font-family=%22sans-serif%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22%23f59e0b%22%3EK%3C/text%3E%3C/svg%3E">
<title>정책 브리핑 · KHMI AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f5aa8}a:hover{color:#1f3f80}
a:focus-visible,button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #5b8ce6;outline-offset:2px}
summary{cursor:pointer}
</style>

</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="font-family: 'Noto Sans KR', sans-serif; color: #111827; background: #ffffff; min-height: 100vh">
<header style="background: #233a70; color: #ffffff">
<div style="max-width: 1180px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
<a href="index.html" style="display: flex; flex-direction: column; gap: 3px; color: #ffffff; text-decoration: none">
<span style="font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 24px; letter-spacing: 0.08em">KHMI <span style="color: #9db8ef">AI</span></span>
<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: rgba(255,255,255,0.8); border-top: 2px solid #5b8ce6; padding-top: 3px">Korea Housing Market Intelligence</span>
</a>
<nav aria-label="주요 메뉴" style="display: flex; flex-wrap: wrap; gap: 2px; font-size: 14px">
<a href="index.html" style="color: #ffffff; text-decoration: none; padding: 10px 11px; white-space: nowrap; color: rgba(255,255,255,0.86)">홈</a>
<a href="region.html" style="color: #ffffff; text-decoration: none; padding: 10px 11px; white-space: nowrap; color: rgba(255,255,255,0.86)">지역 브리핑 <span style="font-size: 10px; font-weight: 500; opacity: 0.8">with AI</span></a>
<a href="policy.html" aria-current="page" style="color: #ffffff; text-decoration: none; padding: 10px 11px; white-space: nowrap; font-weight: 700; box-shadow: inset 0 -2px 0 #9db8ef">정책 브리핑 <span style="font-size: 10px; font-weight: 500; opacity: 0.8">with AI</span></a>
<a href="ask.html" style="color: #ffffff; text-decoration: none; padding: 10px 11px; white-space: nowrap; color: rgba(255,255,255,0.86)">AI 챗봇</a>
<a href="/pitch/" style="color: #ffffff; text-decoration: none; padding: 10px 11px; white-space: nowrap; color: rgba(255,255,255,0.86)">프로젝트 소개</a>
</nav>
</div>
</header>
<p style="margin: 0; background: #fdf6ec; color: #7a4f12; font-size: 12px; text-align: center; padding: 6px 12px; border-bottom: 1px solid #f1e3c8">프로토타입 · 지표는 2026년 10월, 정책 발표는 11월 21일까지의 실제 자료입니다 · AI 문장·평가·예측은 예시입니다</p>

<main style="max-width: 1180px; margin: 0 auto; padding: 26px 24px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px">
<div><h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 28px; color: #1f3166">정책 브리핑 <span style="font-family: 'Noto Sans KR', sans-serif; font-size: 13px; font-weight: 500; color: #2f5aa8">with AI</span></h1>
<p style="margin: 6px 0 0; font-size: 15px; color: #374151">대출·세금 규칙은 13개월째 그대로, 공급과 주거지원은 확대</p></div>
<a href="zone.html" style="font-size: 14px; font-weight: 700">시기별 규제지역 지도 →</a>
</div>

<section aria-label="지금 정책 상태" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch">
<div style="flex: 0 1 300px; min-width: 260px; border-radius: 10px; background: #f5f7fa; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 12px; color: #4b5563">정책 기조 지수 · 100 = 2016년 이후 평균</p>
<p style="margin: 0; display: flex; align-items: baseline; gap: 8px"><span style="font-size: 28px; font-weight: 700; color: #a63d2a">130</span><span style="font-size: 13px; color: #374151">2016년 이후 가장 강화된 수준</span></p>
<div role="img" aria-label="50부터 150까지의 눈금에서 지금은 130입니다." style="position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #cfe3ec 0%, #eef0f3 50%, #f3d3c8 100%)"><div style="position: absolute; left: 50%; top: -3px; width: 2px; height: 14px; margin-left: -1px; background: #6b7280"></div><div style="position: absolute; left: 80%; top: -4px; width: 16px; height: 16px; margin-left: -8px; border-radius: 8px; background: #ffffff; border: 3px solid #a63d2a; box-sizing: border-box"></div></div>
<a href="#trend-title" style="font-size: 12px; font-weight: 700">2016년 이후 흐름 보기 ↓</a>
</div>
<div style="flex: 999 1 520px; min-width: 0; border-radius: 10px; background: #f5f7fa; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 12px; color: #4b5563">수단별 지금 상태 · 최근 12개월 강화 0 · 완화 0 · 공급 확대 3</p>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<template data-sc="for" list="{{tools}}" as="tl" hint-placeholder-count="5"><div style="background: #ffffff; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; font-weight: 700">{{tl.name}}</span><span style="{{tl.chip}}">{{tl.state}}</span></div></template>
</div>
</div>
</section>

<section aria-labelledby="new-t" style="display: flex; flex-wrap: wrap; border: 1px solid #f0d9a8; background: #fffaf0; border-radius: 10px">
<div style="flex: 0 0 120px; padding: 12px 14px; border-right: 1px solid #f0d9a8"><h2 id="new-t" style="margin: 0; font-size: 14px">최근 발표</h2><p style="margin: 2px 0 0; font-size: 12px; color: #6b7280">전체 목록의 최신 3건</p></div>
<template data-sc="for" list="{{recent}}" as="r" hint-placeholder-count="3"><button type="button" onClick="{{r.pick}}" style="flex: 1 1 220px; min-width: 0; font: inherit; text-align: left; border: 0; border-right: 1px solid #f0d9a8; background: transparent; padding: 10px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 12px; color: #6b7280">{{r.date}} · <span style="{{r.chip}}">{{r.status}}</span></span><span style="font-size: 14px; font-weight: 700; color: #111827">{{r.title}}</span><span style="font-size: 12px; color: #4b5563">{{r.line}}</span></button></template>
</section>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
<div role="group" aria-label="분류" style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-sc="for" list="{{cats}}" as="c" hint-placeholder-count="7"><button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button></template>
</div>
<label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4b5563">정책 검색<input type="search" value="{{q}}" onChange="{{onQ}}" placeholder="예: 청년, 대출" style="font: inherit; font-size: 16px; width: 220px; min-height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c9ced6; border-radius: 8px"></label>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<nav aria-label="정책 목록" style="flex: 0 1 270px; min-width: 240px; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column">
<template data-sc="for" list="{{list}}" as="it" hint-placeholder-count="12"><button type="button" aria-current="{{it.current}}" onClick="{{it.pick}}" style="{{it.style}}"><span style="font-size: 12px; color: #6b7280">{{it.cat}} · {{it.date}} <span style="{{it.newStyle}}">새 발표</span></span><span style="font-size: 14px; font-weight: 700; color: #111827; line-height: 1.45">{{it.title}}</span></button></template>
<template data-sc="if" value="{{empty}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 16px; font-size: 13px; color: #6b7280">찾는 정책이 없습니다. 다른 낱말로 검색하거나 분류를 ‘전체’로 바꿔 보세요.</p></template>
</nav>

<article id="pol-detail" aria-labelledby="d-title" style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
<template data-sc="for" list="{{d.tags}}" as="tg" hint-placeholder-count="2"><span style="font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #eef0f3; color: #374151">{{tg.name}}</span></template>
<span style="{{d.dirChip}}">{{d.dirLabel}}</span><span style="{{d.stChip}}">{{d.status}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 id="d-title" style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 26px; line-height: 1.35; color: #1f3166">{{d.title}}</h2>
<p style="margin: 0; font-size: 13px; color: #4b5563">{{d.date}} 발표 · {{d.agency}} · <a href="{{d.url}}" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a></p>
</div>
<section aria-label="AI 브리핑" style="border: 1px solid #c9d5ea; background: #f2f6fc; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 13px; font-weight: 700; color: #1f3166">AI 브리핑 <span style="font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 10px; background: #fdf3df; color: #8a5a00">예시 해설</span></p>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #111827">{{d.ai}}</p>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: #374151"><strong>체크포인트</strong> {{d.check}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: #4b5563">같이 볼 지표<template data-sc="for" list="{{d.see}}" as="sv" hint-placeholder-count="2"><a href="region.html" style="display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border-radius: 16px; background: #ffffff; border: 1px solid #c9d5ea; text-decoration: none; font-size: 13px">{{sv.name}}</a></template></div>
</section>

<template data-sc="if" value="{{d.major}}" hint-placeholder-val="{{ true }}">
<div role="tablist" aria-label="상세 보기" style="display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid #e5e7eb">
<template data-sc="for" list="{{tabs}}" as="tb" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="{{tb.style}}">{{tb.label}}</button></template>
</div>
<div role="tabpanel" style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.7; color: #374151">
<template data-sc="for" list="{{panel}}" as="pn" hint-placeholder-count="3"><div style="{{pn.row}}"><span style="{{pn.headStyle}}">{{pn.head}}</span><span>{{pn.text}}</span></div></template>
</div>
<section aria-labelledby="ev-t" style="display: flex; flex-direction: column; gap: 8px">
<h3 id="ev-t" style="margin: 0; font-size: 16px">기준별 평가 <span style="font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 10px; background: #fdf3df; color: #8a5a00">예시 평가</span></h3>
<p style="margin: 0; font-size: 12px; color: #6b7280">총점 없이, 원문에 근거가 있는지만 봅니다. 정책이 옳은지·효과가 있었는지는 평가하지 않습니다.</p>
<div style="display: flex; flex-direction: column; border: 1px solid #e5e7eb; border-radius: 10px">
<template data-sc="for" list="{{evals}}" as="ev" hint-placeholder-count="3"><div style="{{ev.row}}"><span style="flex: 0 0 150px; display: flex; flex-direction: column"><strong style="font-size: 14px; color: #1f3166">{{ev.name}}</strong><span style="font-size: 12px; color: #6b7280">{{ev.q}}</span></span><span style="{{ev.chip}}">{{ev.grade}}</span><span style="flex: 1 1 240px; font-size: 14px; color: #374151">{{ev.why}}</span></div></template>
</div>
<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #6b7280">{{d.mkt}}</p>
</section>
</template>
<template data-sc="if" value="{{d.news}}" hint-placeholder-val="{{ false }}">
<dl style="margin: 0; display: grid; grid-template-columns: 64px 1fr; row-gap: 6px; font-size: 14px; line-height: 1.6"><dt style="color: #6b7280">대상</dt><dd style="margin: 0">{{d.who}}</dd><dt style="color: #6b7280">적용</dt><dd style="margin: 0">{{d.when}}</dd></dl>
<p style="margin: 0; font-size: 13px; line-height: 1.6; color: #6b7280">대책급 발표가 아니어서 정책 기조 지수와 기준별 평가에는 넣지 않습니다.</p>
</template>
</article>

<aside aria-labelledby="flow-t" style="flex: 0 1 250px; min-width: 230px; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
<h2 id="flow-t" style="margin: 0 0 4px; font-size: 15px">정책 흐름</h2>
<template data-sc="for" list="{{flow}}" as="f" hint-placeholder-count="8">
<template data-sc="if" value="{{f.hasRel}}" hint-placeholder-val="{{ true }}"><span style="align-self: flex-start; margin-left: 12px; font-size: 11px; font-weight: 700; color: #4b5563; border-left: 2px solid #c9ced6; padding: 2px 0 2px 8px">{{f.rel}} ↓</span></template>
<button type="button" aria-current="{{f.current}}" onClick="{{f.pick}}" style="{{f.style}}"><span style="font-size: 11px; color: #6b7280">{{f.date}}</span><span style="font-size: 13px; font-weight: 700">{{f.short}}</span><span style="font-size: 11px; color: #4b5563">{{f.dir}}</span></button>
</template>
<span style="align-self: flex-start; margin-left: 12px; font-size: 11px; font-weight: 700; color: #4b5563; border-left: 2px dashed #c9ced6; padding: 2px 0 2px 8px">지금 ↓</span>
<div style="border: 1px dashed #9aa3b2; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #374151"><strong>2026.11 지금</strong><br>대출·세금 규칙 13개월째 그대로</div>
<a href="ask.html" style="margin-top: 6px; display: flex; align-items: center; justify-content: center; min-height: 40px; border-radius: 8px; background: #1f3166; color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 700">이 흐름을 AI에게 묻기</a>
<template data-sc="if" value="{{d.zone}}" hint-placeholder-val="{{ false }}"><a href="zone.html" style="font-size: 13px; font-weight: 700; text-align: center">규제지역 지도에서 보기 →</a></template>
</aside>
</div>

<section aria-labelledby="trend-title" style="padding-top: 18px; display: flex; flex-direction: column; gap: 10px">
<h2 id="trend-title" style="margin: 0; font-size: 20px">2016년 이후 정책 기조</h2>
<p style="margin: 0; font-size: 14px; color: #4b5563">대출·세제·청약·임대차 규칙을 강화하면 +5, 완화하면 −5로 쌓은 지수입니다. 공급 확대와 임차인 보호는 지수에 넣지 않고 아래 줄에 따로 표시합니다.</p>
<div style="border: 1px solid #e5e7eb; border-radius: 12px; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 13px; font-weight: 700; color: #374151">정책 기조 지수 (전국) <span style="font-weight: 400; color: #6b7280">· 100 = 2016년 이후 평균 · 점에 마우스를 올리면 대책 내용, 누르면 원문</span></p>
