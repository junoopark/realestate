<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="font-family: 'Noto Sans KR', sans-serif; color: #111827; background: #ffffff; min-height: 100vh">
<header style="background: #233a70; color: #ffffff">
<div style="max-width: 1180px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
<a href="index.html" style="display: flex; flex-direction: column; gap: 3px; color: #ffffff; text-decoration: none">
<span style="font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 24px; letter-spacing: 0.08em">KHMI <span style="color: #9db8ef">AI</span></span>
<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: rgba(255,255,255,0.8); border-top: 2px solid #5b8ce6; padding-top: 3px">Korea Housing Market Intelligence</span>
</a>
<nav aria-label="주요 메뉴" style="display: flex; flex-wrap: wrap; gap: 2px; font-size: 14px">
<a href="index.html" aria-current="page" style="color: #ffffff; text-decoration: none; padding: 10px 11px; white-space: nowrap; font-weight: 700; box-shadow: inset 0 -2px 0 #9db8ef">홈</a>
<a href="region.html" style="color: #ffffff; text-decoration: none; padding: 10px 11px; white-space: nowrap; color: rgba(255,255,255,0.86)">지역 브리핑 <span style="font-size: 10px; font-weight: 500; opacity: 0.8">with AI</span></a>
<a href="policy.html" style="color: #ffffff; text-decoration: none; padding: 10px 11px; white-space: nowrap; color: rgba(255,255,255,0.86)">정책 브리핑 <span style="font-size: 10px; font-weight: 500; opacity: 0.8">with AI</span></a>
<a href="ask.html" style="color: #ffffff; text-decoration: none; padding: 10px 11px; white-space: nowrap; color: rgba(255,255,255,0.86)">AI 챗봇</a>
<a href="/pitch/" style="color: #ffffff; text-decoration: none; padding: 10px 11px; white-space: nowrap; color: rgba(255,255,255,0.86)">프로젝트 소개</a>
</nav>
</div>
</header>
<p style="margin: 0; background: #fdf6ec; color: #7a4f12; font-size: 12px; text-align: center; padding: 6px 12px; border-bottom: 1px solid #f1e3c8">프로토타입 · 지표는 2026년 10월, 정책 발표는 11월 21일까지의 실제 자료입니다 · AI 문장·평가·예측은 예시입니다</p>

<section aria-labelledby="hero" style="background: #f5f7fa; border-bottom: 1px solid #e8ebf0">
<div style="max-width: 1180px; margin: 0 auto; padding: 36px 24px 30px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center">
<div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<h1 id="hero" style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 32px; line-height: 1.4; color: #1f3166; letter-spacing: -0.02em">시장의 숫자와 정책의 흐름을<br>한 번에 읽습니다.</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #4b5563">집을 사거나 빌리거나 짓는 사람, 정책 흐름을 보는 사람을 위한 주거시장 AI</p>
</div>
<div style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<label for="q" style="font-size: 13px; font-weight: 700; color: #1f3166">KHMI에게 물어보세요</label>
<div style="display: flex; gap: 8px">
<input id="q" type="text" placeholder="지표와 정책을 함께 물어보세요 (예: 서울 월세 요즘 어때?)" style="flex: 1; min-width: 0; font: inherit; font-size: 14px; padding: 12px 14px; border: 2px solid #2f5aa8; border-radius: 10px; background: #ffffff">
<a href="ask.html" style="display: inline-flex; align-items: center; min-height: 46px; padding: 0 18px; border-radius: 10px; background: #2f5aa8; color: #ffffff; font-weight: 700; text-decoration: none; font-size: 14px; white-space: nowrap">AI에게 질문</a>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-sc="for" list="{{qs}}" as="q" hint-placeholder-count="4"><a href="ask.html" style="display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #c9d5ea; background: #ffffff; color: #1f3166; text-decoration: none; font-size: 13px">{{q.text}}</a></template>
</div>
</div>
</div>
</section>

<main style="max-width: 1180px; margin: 0 auto; padding: 0 24px">
<section aria-labelledby="who-t" style="padding: 28px 0 4px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<h2 id="who-t" style="margin: 0; font-size: 18px; color: #111827">어떤 상황이세요?</h2>
<div role="group" aria-labelledby="who-t" style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-sc="for" list="{{whoList}}" as="w" hint-placeholder-count="4"><button type="button" aria-pressed="{{w.pressed}}" onClick="{{w.pick}}" style="{{w.style}}">{{w.label}}</button></template>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px">
<template data-sc="for" list="{{picks}}" as="p" hint-placeholder-count="3">
<a href="{{p.href}}" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid #e5e7eb; border-radius: 12px; text-decoration: none; color: #111827; background: #ffffff">
<span style="font-size: 12px; font-weight: 700; color: #2f5aa8">{{p.where}}</span>
<span style="font-size: 15px; font-weight: 700">{{p.title}}</span>
<span style="font-size: 13px; line-height: 1.6; color: #4b5563">{{p.why}}</span>
</a>
</template>
</div>
</section>

<section aria-labelledby="rb-t" style="padding: 32px 0 4px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px">
<div><h2 id="rb-t" style="margin: 0; font-size: 20px; color: #111827">이달의 지역 브리핑 <span style="font-size: 12px; font-weight: 500; color: #2f5aa8">with AI</span></h2>
<p style="margin: 4px 0 0; font-size: 13px; color: #6b7280">2026년 10월 · 1년 전 대비 · 한국부동산원</p></div>

</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: stretch">
