<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%230b2447%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2216%22 font-family=%22sans-serif%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22%23f59e0b%22%3EK%3C/text%3E%3C/svg%3E">
<title>AI 챗봇 · KHMI AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2f5aa8}a:hover{color:#1f3f80}
a:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid #5b8ce6;outline-offset:2px}
button:disabled{cursor:not-allowed}
</style>

</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="font-family: 'Noto Sans KR', sans-serif; color: #111827; background: #ffffff; min-height: 100vh">
<header style="background: #233a70; color: #ffffff">
<div style="max-width: 1180px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
<a href="index.html" style="display: flex; flex-direction: column; gap: 3px; color: #ffffff; text-decoration: none">
<span style="font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 24px; letter-spacing: 0.08em">KHMI <span style="color: #9db8ef">AI</span></span>
<span style="font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: rgba(255,255,255,0.8); border-top: 2px solid #5b8ce6; padding-top: 3px">Korea Housing Market Intelligence</span>
</a>
<nav aria-label="주요 메뉴" style="display: flex; flex-wrap: wrap; gap: 2px; font-size: 14px">
<a href="index.html" style="color: #ffffff; text-decoration: none; padding: 10px 11px; white-space: nowrap; color: rgba(255,255,255,0.86)">홈</a>
<a href="region.html" style="color: #ffffff; text-decoration: none; padding: 10px 11px; white-space: nowrap; color: rgba(255,255,255,0.86)">지역 브리핑 <span style="font-size: 10px; font-weight: 500; opacity: 0.8">with AI</span></a>
<a href="policy.html" style="color: #ffffff; text-decoration: none; padding: 10px 11px; white-space: nowrap; color: rgba(255,255,255,0.86)">정책 브리핑 <span style="font-size: 10px; font-weight: 500; opacity: 0.8">with AI</span></a>
<a href="ask.html" aria-current="page" style="color: #ffffff; text-decoration: none; padding: 10px 11px; white-space: nowrap; font-weight: 700; box-shadow: inset 0 -2px 0 #9db8ef">AI 챗봇</a>
<a href="/pitch/" style="color: #ffffff; text-decoration: none; padding: 10px 11px; white-space: nowrap; color: rgba(255,255,255,0.86)">프로젝트 소개</a>
</nav>
</div>
</header>
<p style="margin: 0; background: #fdf6ec; color: #7a4f12; font-size: 12px; text-align: center; padding: 6px 12px; border-bottom: 1px solid #f1e3c8">프로토타입 · 지표는 2026년 10월, 정책 발표는 11월 21일까지의 실제 자료입니다 · AI 문장·평가·예측은 예시입니다</p>


<main style="max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 30px; color: #1f3166; letter-spacing: -0.02em">KHMI AI에 묻기</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #4b5563">정책 원문을 근거로 답하고, 앞뒤 정책이 어떻게 이어지는지 함께 보여 드립니다. 가격 전망은 예측 모델 결과로 안내하고, 사고팔지에 대한 판단은 하지 않습니다.</p>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section aria-label="대화" style="flex: 999 1 620px; min-width: 0; border: 1px solid #e5e7eb; border-radius: 14px; display: flex; flex-direction: column">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 20px; border-bottom: 1px solid #eef0f3">
<span id="who-label" style="font-size: 14px; font-weight: 700; color: #1f3166">어떤 상황이세요?</span>
<div role="group" aria-labelledby="who-label" style="display: flex; flex-wrap: wrap; gap: 6px">
<template data-sc="for" list="{{whoList}}" as="w" hint-placeholder-count="4">
<button type="button" aria-pressed="{{w.pressed}}" onClick="{{w.pick}}" style="{{w.style}}">{{w.label}}</button>
</template>
</div>

</div>

<div style="padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; min-height: 460px">
<template data-sc="if" value="{{hasAsked}}" hint-placeholder-val="{{ true }}">
<div style="align-self: flex-end; max-width: 78%; background: #1f3166; color: #ffffff; border-radius: 14px 14px 4px 14px; padding: 12px 16px; font-size: 15px; line-height: 1.6">{{asked}}</div>
</template>

<template data-sc="if" value="{{showStatus}}" hint-placeholder-val="{{ false }}">
<p role="status" style="margin: 0; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #4b5563"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #2f5aa8"></span>{{statusText}}</p>
</template>

<template data-sc="if" value="{{showAnswer}}" hint-placeholder-val="{{ true }}">
<article style="align-self: flex-start; max-width: 94%; display: flex; flex-direction: column; gap: 12px; font-size: 15px; line-height: 1.85">
<p style="margin: 0"><template data-sc="for" list="{{para1}}" as="c" hint-placeholder-count="3">{{c.text}}<template data-sc="if" value="{{c.hasCite}}" hint-placeholder-val="{{ false }}"><a href="{{c.url}}" target="_blank" rel="noopener" aria-label="{{c.aria}}" style="font-weight: 700; text-decoration: none"><sup>[{{c.n}}]</sup></a></template></template></p>
<template data-sc="if" value="{{hasPara2}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0"><template data-sc="for" list="{{para2}}" as="c" hint-placeholder-count="2">{{c.text}}<template data-sc="if" value="{{c.hasCite}}" hint-placeholder-val="{{ false }}"><a href="{{c.url}}" target="_blank" rel="noopener" aria-label="{{c.aria}}" style="font-weight: 700; text-decoration: none"><sup>[{{c.n}}]</sup></a></template></template></p>
</template>
<template data-sc="if" value="{{isStopped}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 13px; color: #7a5200">답변을 멈췄습니다. 받은 부분까지 남겨 두었습니다.</p>
</template>
</article>
</template>

<template data-sc="if" value="{{showOkExtras}}" hint-placeholder-val="{{ true }}">
<div style="align-self: flex-start; max-width: 94%; display: flex; flex-direction: column; gap: 12px">
<ol style="margin: 0; padding: 12px 0 0; list-style: none; border-top: 1px solid #eef0f3; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.55">
<template data-sc="for" list="{{sources}}" as="s" hint-placeholder-count="2">
<li><a href="{{s.url}}" target="_blank" rel="noopener">[{{s.n}}] {{s.org}} · {{s.title}} ({{s.date}}) ↗</a></li>
</template>
</ol>
<p style="margin: 0; font-size: 12px; color: #6b7280">AI가 정책 원문을 근거로 쓴 답입니다. 틀릴 수 있으니 번호를 눌러 원문을 확인해 주세요.</p>
<div role="group" aria-label="답변 도구" style="display: flex; flex-wrap: wrap; gap: 6px">
<button type="button" onClick="{{copyAnswer}}" style="font: inherit; font-size: 13px; min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #d5d9e0; background: #ffffff; color: #374151; cursor: pointer">복사</button>
<button type="button" aria-pressed="{{pUp}}" onClick="{{rateUp}}" style="{{sUp}}">도움이 됐어요</button>
<button type="button" aria-pressed="{{pDown}}" onClick="{{rateDown}}" style="{{sDown}}">아쉬워요</button>
</div>
<template data-sc="if" value="{{isDown}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px">
<span style="color: #4b5563">무엇이 아쉬웠나요?</span>
<button type="button" onClick="{{sendReason}}" style="font: inherit; font-size: 12px; min-height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid #d5d9e0; background: #ffffff; color: #374151; cursor: pointer">원문과 다름</button>
<button type="button" onClick="{{sendReason}}" style="font: inherit; font-size: 12px; min-height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid #d5d9e0; background: #ffffff; color: #374151; cursor: pointer">질문과 다른 답</button>
<button type="button" onClick="{{sendReason}}" style="font: inherit; font-size: 12px; min-height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid #d5d9e0; background: #ffffff; color: #374151; cursor: pointer">너무 어려움</button>
</div>
</template>
<p role="status" style="margin: 0; min-height: 16px; font-size: 12px; color: #26704a">{{toolMsg}}</p>
</div>
</template>

<template data-sc="if" value="{{isNoEvidence}}" hint-placeholder-val="{{ false }}">
<article style="align-self: flex-start; max-width: 94%; border-radius: 12px; background: #fdf8ec; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.75">
<p style="margin: 0; font-weight: 700; color: #4a3a12">자료에서 답을 찾지 못했습니다</p>
<p style="margin: 0; color: #4a3a12">정책 원문 가운데 이 질문에 직접 답하는 내용이 없었습니다. 추측으로 답하지 않고 여기서 멈춥니다.</p>
<p style="margin: 0; font-size: 13px; color: #6b5a2e">정책 이름이나 시기를 넣으면 찾을 가능성이 높아집니다. 예: “10·15 대책 대출 한도”</p>
<div><a href="policy.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid #d9c9a0; background: #ffffff; color: #4a3a12; text-decoration: none; font-size: 14px">정책 브리핑에서 직접 보기</a></div>
</article>
</template>

<template data-sc="if" value="{{isMarket}}" hint-placeholder-val="{{ false }}">
<article style="align-self: flex-start; max-width: 94%; border-radius: 12px; background: #f5f7fa; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; font-size: 15px; line-height: 1.75">
<p style="margin: 0; font-weight: 700; color: #1f3166">가격 전망은 예측 모델 결과로 답합니다</p>
<p style="margin: 0; color: #374151">{{fc.lead}} AI가 따로 전망을 만들지 않고, 예측 모델이 낸 결과만 옮겨 드립니다.</p>
<div style="border-radius: 10px; background: #ffffff; border: 1px solid #e5e7eb; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 13px; font-weight: 700; color: #374151">지금까지 · {{fc.rg}} · 2026년 10월 기준</p>
<div style="display: grid; grid-template-columns: minmax(0, 9em) minmax(0, 1fr); gap: 4px 12px; font-size: 14px; line-height: 1.6"><span style="color: #4b5563">최근 1년 가격지수</span><span style="font-weight: 700; color: #111827">{{fc.past}}</span><span style="color: #4b5563">지금 규제지역</span><span style="color: #111827">{{fc.reg}}</span></div>
<p style="margin: 0; font-size: 12px; color: #6b7280">한국부동산원 아파트 매매·전세가격지수, 월세통합가격지수</p>
</div>
<div style="border-radius: 10px; background: #ffffff; border: 1px dashed #9aa8c2; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 13px; font-weight: 700; color: #374151">앞으로 3개월 · 아파트 월세 · 예측 모델 결과 <span style="font-weight: 500; color: #8a5a00">(예시)</span></p>
<div style="display: grid; grid-template-columns: minmax(0, 9em) minmax(0, 1fr); gap: 4px 12px; font-size: 14px; line-height: 1.6"><span style="color: #4b5563">지수 예측</span><span style="color: #111827; font-weight: 700">{{fc.fNum}}</span><span style="color: #4b5563">급등·급락 경보</span><span style="color: #111827; font-weight: 700">{{fc.fAlert}}</span><span style="color: #4b5563">범위·신뢰도</span><span style="color: #111827">{{fc.fRange}}</span><span style="color: #4b5563">함께 보는 지표</span><span style="color: #111827">{{fc.fFactor}}</span></div>
<p style="margin: 0; font-size: 12px; color: #6b7280">모델 결과는 확정된 전망이 아닙니다. 숫자는 모델 결과에서만 옮기고, 답변에서 새로 만들지 않습니다.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="forecast.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #c9ced6; background: #ffffff; color: #111827; text-decoration: none; font-size: 14px">예측 지표에서 자세히</a><a href="region.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #c9ced6; background: #ffffff; color: #111827; text-decoration: none; font-size: 14px">지역 브리핑 보기</a>
<button type="button" onClick="{{askLoan}}" style="font: inherit; font-size: 14px; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #c9ced6; background: #ffffff; color: #111827; cursor: pointer">지금 대출 한도 보기</button>
</div>
</article>
</template>

<template data-sc="if" value="{{isAdvice}}" hint-placeholder-val="{{ false }}">
<article style="align-self: flex-start; max-width: 94%; border-radius: 12px; background: #f5f7fa; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; font-size: 15px; line-height: 1.75">
<p style="margin: 0; font-weight: 700; color: #1f3166">사라·팔라는 판단은 드리지 않습니다</p>
<p style="margin: 0; color: #374151">자금 사정과 대출 조건에 따라 답이 달라지기 때문입니다. 대신 {{fc.rg}} 기준으로 판단에 쓸 재료를 모아 드릴게요.</p>
<ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: #111827">
<li><strong>가격 흐름과 예측</strong> · 최근 1년 {{fc.past}}. 예측 모델 결과(예시)는 {{fc.fShort}}입니다.</li>
<li><strong>지금 대출 한도</strong> · 집값과 지역에 따라 주담대 한도가 다릅니다.</li>
<li><strong>규제지역·토지거래허가</strong> · 지금 규제지역: {{fc.reg}}. 토지거래허가구역이면 사기 전에 허가가 필요합니다.</li>
</ol>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="forecast.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #c9ced6; background: #ffffff; color: #111827; text-decoration: none; font-size: 14px">예측 지표에서 자세히</a><a href="region.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #c9ced6; background: #ffffff; color: #111827; text-decoration: none; font-size: 14px">지역 브리핑 보기</a>
<button type="button" onClick="{{askLoan}}" style="font: inherit; font-size: 14px; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #c9ced6; background: #ffffff; color: #111827; cursor: pointer">지금 대출 한도 보기</button>
<a href="zone.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #c9ced6; background: #ffffff; color: #111827; text-decoration: none; font-size: 14px">규제지역 지도 보기</a>
</div>
</article>
</template>
<p role="status" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0">{{liveMsg}}</p>
</div>

<div style="padding: 0 20px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<span style="font-size: 13px; color: #6b7280">추천 질문</span>
<template data-sc="for" list="{{prompts}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.ask}}" disabled="{{p.disabled}}" style="font: inherit; font-size: 14px; min-height: 38px; padding: 0 14px; border-radius: 19px; border: 1px solid #c9d5ea; background: #f3f6fb; color: #1f3166; cursor: pointer">{{p.text}}</button>
</template>
</div>

<form aria-label="질문 입력" onSubmit="{{onSubmit}}" style="border-top: 1px solid #eef0f3; padding: 14px 20px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 10px; align-items: flex-end">
<label style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #6b7280">궁금한 정책을 물어보세요 (Enter 보내기 · Shift+Enter 줄바꿈)
<textarea rows="2" value="{{input}}" onChange="{{onInput}}" onKeyDown="{{onKey}}" placeholder="예: 6·27 대책 이후 전세대출은 어떻게 바뀌었어?" style="font: inherit; font-size: 15px; color: #111827; border: 1px solid #c9ced6; border-radius: 10px; padding: 10px 12px; resize: vertical"></textarea>
</label>
<template data-sc="if" value="{{busy}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{stop}}" style="font: inherit; font-size: 14px; font-weight: 700; min-height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid #7a2f12; background: #ffffff; color: #7a2f12; cursor: pointer">멈추기</button>
</template>
<template data-sc="if" value="{{notBusy}}" hint-placeholder-val="{{ true }}">
<button type="submit" disabled="{{sendDisabled}}" style="{{sendStyle}}">보내기</button>
</template>
</div>
<p style="margin: 0; font-size: 12px; color: #6b7280">질문은 답을 만들기 위해 Google Gemini로 보내집니다. 주민등록번호·계좌번호 같은 개인정보는 입력하지 마세요.</p>
</form>
</section>

<aside aria-labelledby="chain-title" style="flex: 1 1 320px; min-width: 0; border-radius: 14px; background: #f5f7fa; padding: 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<p id="chain-title" style="margin: 0; font-size: 13px; font-weight: 700; color: #2f5aa8">이 답변의 연결고리</p>
<h2 style="margin: 0; font-size: 18px; line-height: 1.45; color: #1f3166">{{chainTitle}}</h2>
</div>
<template data-sc="if" value="{{showChain}}" hint-placeholder-val="{{ true }}">
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<template data-sc="for" list="{{chain}}" as="k" hint-placeholder-count="4">
<li style="display: flex; gap: 12px">
<div aria-hidden="true" style="display: flex; flex-direction: column; align-items: center; flex: none; width: 14px">
<span style="{{k.dot}}"></span>
<span style="{{k.line}}"></span>
</div>
<div style="padding-bottom: 16px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #6b7280">{{k.date}}</span>
<span style="{{k.nameStyle}}">{{k.name}}</span>
<span style="font-size: 13px; line-height: 1.55; color: #4b5563">{{k.note}}</span>
</div>
</li>
</template>
</ol>
<a href="{{detailHref}}" style="display: inline-flex; justify-content: center; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 10px; background: #1f3166; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 700">{{detailLabel}}</a>
</template>
<template data-sc="if" value="{{noChain}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: #4b5563">근거가 있는 답이 나오면, 그 정책의 앞뒤 정책과 지금 상태가 여기에 이어서 나타납니다.</p>
</template>
</aside>
</div>
</main>
</div>
</template>
<script src="/morphdom.min.js"></script>
<script src="/dc-lite.js"></script>
<script>

class Component extends DCLogic {
