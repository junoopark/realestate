<p style="margin: 0; background: #fdf6ec; color: #7a4f12; font-size: 12px; text-align: center; padding: 6px 12px; border-bottom: 1px solid #f1e3c8">프로토타입 · 지표는 2026년 10월, 정책 발표는 11월 21일까지의 실제 자료입니다 · AI 문장·평가·예측은 예시입니다</p>
