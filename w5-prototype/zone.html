<p style="margin: 0; background: #fdf6ec; color: #7a4f12; font-size: 12px; text-align: center; padding: 6px 12px; border-bottom: 1px solid #f1e3c8">프로토타입 · 지표는 2026년 10월, 정책 발표는 11월 21일까지의 실제 자료입니다 · AI 문장·평가·예측은 예시입니다</p>

<div style="display: flex; flex-direction: column; gap: 6px">
<a href="policy.html" style="font-size: 13px; text-decoration: none">← 정책 브리핑으로</a>
<h1 style="margin: 0; font-family: 'Noto Serif KR', serif; font-size: 30px; color: #1f3166; letter-spacing: -0.02em">시기별 규제지역 지도</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #4b5563; max-width: 760px">투기지역·투기과열지구·조정대상지역과 토지거래허가구역(주택)이 언제, 어디에 걸려 있었는지 봅니다. 날짜는 효력이 생긴 날 기준이고, 전국 정책 기조와는 따로 지역별로 봅니다.</p>
</div>

<section aria-label="날짜 고르기" style="border-radius: 14px; background: #f5f7fa; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; gap: 6px">
<button type="button" onClick="{{prev}}" aria-label="이전 변경일" style="font: inherit; font-size: 16px; width: 44px; height: 44px; border-radius: 10px; border: 1px solid #c9ced6; background: #ffffff; color: #1f3166; cursor: pointer">‹</button>
<button type="button" onClick="{{next}}" aria-label="다음 변경일" style="font: inherit; font-size: 16px; width: 44px; height: 44px; border-radius: 10px; border: 1px solid #c9ced6; background: #ffffff; color: #1f3166; cursor: pointer">›</button>
<button type="button" onClick="{{togglePlay}}" aria-pressed="{{playPressed}}" style="font: inherit; font-size: 14px; font-weight: 700; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #1f3166; color: #ffffff; cursor: pointer">{{playLabel}}</button>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 360px">
<p style="margin: 0; font-size: 22px; font-weight: 700; color: #111827">{{dateLabel}}</p>
<p style="margin: 0; font-size: 14px; color: #374151">{{evTitle}}</p>
</div>
<p style="margin: 0; font-size: 13px; color: #6b7280">변경일 {{idxLabel}}</p>
</div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #6b7280">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">변경일 고르기</span>
<input type="range" min="0" max="{{maxIdx}}" step="1" value="{{idx}}" onChange="{{onIdx}}" style="width: 100%">
<span style="display: flex; justify-content: space-between"><span>2016.11 조정대상지역 도입</span><span>2026.7 동탄·기흥·구리 추가</span></span>
</label>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-label="지도" style="flex: 999 1 600px; min-width: 0; border: 1px solid #e5e7eb; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px">
<div role="group" aria-label="보는 규제" style="display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: #f0f2f6">
<template data-sc="for" list="{{layers}}" as="l" hint-placeholder-count="2"><button type="button" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button></template>
</div>
<div role="group" aria-label="지도 범위" style="display: flex; gap: 4px; padding: 4px; border-radius: 10px; background: #f0f2f6">

</div>

<p style="margin: 0; font-size: 12px; line-height: 1.6; color: #6b7280">시도 안 시군구 가운데 규제지역(셋 중 하나)에 든 비율입니다. 일부 지정은 0.5로 셉니다. 각 달의 말일 기준입니다.</p>
</div>
<div style="flex: 1 1 420px; border-radius: 14px; border: 1px solid #e5e7eb; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 1.7; color: #374151">
<h2 style="margin: 0; font-size: 15px; color: #111827">자료와 한계</h2>
<p style="margin: 0">국토교통부·기획재정부·지자체 발표 24건으로 만들었습니다. 보도자료에 실린 시점별 개수 22개와 2020년 12월 18일 지정 현황표에 모두 맞춰 확인했습니다.</p>
<p style="margin: 0">경계는 통계청 2018년 시군구입니다. 그 뒤 생긴 화성시 동탄구 같은 구는 화성시 일부(빗금)로 그립니다.</p>
<p style="margin: 0">정확한 지정 범위(제외 읍면, 대상 단지)는 각 근거 원문으로 확인해 주세요.</p>

      noHist: hist.length === 0,
      mx: D.xs[st.idx],
      shares: ev.sd.slice(0, 8).map(function (s) { var pct = Math.round(s[1] * 100); return { name: s[0], pct: pct + '%', bar: 'position: absolute; left: 0; top: 0; bottom: 0; width: ' + pct + '%; background: #d9573b; border-radius: 5px' }; })
    };
  }
}

dcMount(Component);
</script>
</body>
</html>
