name: Collect official policy updates

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions: {}

concurrency:
  group: official-policy-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client
        run: python -m pip install 'requests>=2.32,<3'
      - name: Refresh policies when secrets are configured
        env:
          POLICY_API_BASE_URL: ${{ secrets.POLICY_API_BASE_URL }}
          POLICY_ADMIN_TOKEN: ${{ secrets.POLICY_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          from urllib.parse import urlsplit
          import requests

          base = os.environ.get('POLICY_API_BASE_URL', '').strip().rstrip('/')
          token = os.environ.get('POLICY_ADMIN_TOKEN', '').strip()
          if not base or not token:
              print('::notice::Skipped: configure POLICY_API_BASE_URL and POLICY_ADMIN_TOKEN repository secrets. No policy API request was sent.')
              sys.exit(0)
          target = urlsplit(base)
          if target.scheme != 'https' or not target.hostname or target.username or target.password or target.query or target.fragment:
              print('::error::POLICY_API_BASE_URL must be an HTTPS API base URL without credentials, query, or fragment.')
              sys.exit(1)
          try:
              response = requests.post(base + '/policies/refresh', headers={'X-Admin-Token': token}, timeout=90, allow_redirects=False)
              if response.status_code == 409:
                  print('::notice::Collection is already running. Existing job will complete it.')
                  sys.exit(0)
              if response.status_code != 200:
                  print(f'::error::Collection API returned HTTP {response.status_code}. Check Render availability and the administrator token.')
                  sys.exit(1)
              result = response.json()
              for source in result.get('sources', []):
                  print(f"Source {source.get('id')}: {source.get('status')}, matched={source.get('matched', 'unknown')}")
              if result.get('status') != 'ok':
                  print('::error::Collection returned a partial failure. Prior successful data was preserved; inspect /policies/monitor for source status.')
                  sys.exit(1)
              print('Official policy collection completed.')
          except (requests.RequestException, ValueError):
              print('::error::Collection request failed or returned invalid JSON. No credentials or raw network errors are logged.')
              sys.exit(1)
          PY
