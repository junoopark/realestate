<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="index.title">DFMBA 한국 주택시장 101</title>
  <meta name="description" content="주요 부동산 지표를 한 화면에 모아 보는 대시보드" data-i18n-attr="content:index.desc">
  <script src="js/theme-init.js"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/indicators.css">
</head>
<body class="frame">
  <header class="site-header">
    <h1 data-i18n="index.h1">DFMBA 한국 주택시장 101</h1>
    <div class="header-right">
      <!-- 탭: Overview + 6개 동인. 동인 탭 링크는 factors.js 가 data/drivers.json 을 읽어 채운다 -->
      <nav id="view-nav" aria-label="화면 이동" data-i18n-attr="aria-label:nav.aria">
        <a href="#overview" data-view="overview" aria-current="page" data-i18n="nav.overview">Overview</a>
        <a href="warning.html" data-page-link>조기경보</a>
        <a href="learn.html" data-page-link>부동산 기초</a>
        <a href="policies.html" data-page-link>정책 모니터</a>
      </nav>
      <div class="controls">
        <!-- 지역 선택: 타일과 동인 탭 차트가 함께 따른다. 목록은 tiles.js 가 data/indicators/index.json 으로 채운다 -->
        <label class="sr-only" for="region-select">지역</label>
        <select id="region-select"></select>
        <button id="theme-btn" type="button"><span class="ico" aria-hidden="true"></span><span class="lbl"></span></button>
      </div>
    </div>
  </header>

  <!--
    한 화면에 담기는 3 x 2 타일 틀. 내용은 아직 비어 있다. (타일 구성은 임시 — 확정되면 바꾼다)
    - 타일 식별자: prices · transactions · rent · supply · finance · sentiment (좌상단부터 가로 순서)
    - 각 타일의 본문은 <div class="tile-body" data-tile="식별자"> 안에 채운다.
    - 타일 내용은 js/tiles.js 가 data/indicators/<변수id>.json 을 읽어 그린다. (dfmba-dashboard 파이프라인의 export/export_indicators.py 산출)
    - 제목·문구는 한국어는 여기, English 는 js/i18n.js 의 tile.<식별자>.* 키에 둔다.
  -->
  <main class="tiles" id="view-overview">

    <section class="tile" id="tile-prices" aria-labelledby="tile-prices-title">
      <header class="tile-head"><h2 id="tile-prices-title" data-i18n="tile.prices.title">주택가격 동향</h2></header>
      <div class="tile-body" data-tile="prices"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

    <section class="tile" id="tile-transactions" aria-labelledby="tile-transactions-title">
      <header class="tile-head"><h2 id="tile-transactions-title" data-i18n="tile.transactions.title">거래 동향</h2></header>
      <div class="tile-body" data-tile="transactions"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

    <section class="tile" id="tile-rent" aria-labelledby="tile-rent-title">
      <header class="tile-head"><h2 id="tile-rent-title" data-i18n="tile.rent.title">전월세 시장</h2></header>
      <div class="tile-body" data-tile="rent"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

    <section class="tile" id="tile-supply" aria-labelledby="tile-supply-title">
      <header class="tile-head"><h2 id="tile-supply-title" data-i18n="tile.supply.title">공급·분양</h2></header>
      <div class="tile-body" data-tile="supply"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

    <section class="tile" id="tile-finance" aria-labelledby="tile-finance-title">
      <header class="tile-head"><h2 id="tile-finance-title" data-i18n="tile.finance.title">금리·대출</h2></header>
      <div class="tile-body" data-tile="finance"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

    <section class="tile" id="tile-sentiment" aria-labelledby="tile-sentiment-title">
      <header class="tile-head"><h2 id="tile-sentiment-title" data-i18n="tile.sentiment.title">시장 심리</h2></header>
      <div class="tile-body" data-tile="sentiment"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

  </main>
  <!-- 자료 갱신일·출처 한 줄. tiles.js 가 채우고, factors.js 가 Overview 에서만 보이게 한다 -->
  <p id="tiles-note"></p>

  <!-- 동인 탭 화면: factors.js 가 선택한 동인의 설명과 변수 카드를 그린다 -->
  <main class="factor" id="view-factor" hidden></main>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/config.js"></script>
  <script src="js/indicators.js"></script>
  <script src="js/factors.js"></script>
  <script src="js/tiles.js"></script>
</body>
</html>
