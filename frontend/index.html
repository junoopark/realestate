<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="index.title">DFMBA 한국 주택시장 101</title>
  <meta name="description" content="주요 부동산 지표를 한 화면에 모아 보는 대시보드" data-i18n-attr="content:index.desc">
  <script src="js/theme-init.js"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="frame">
  <header class="site-header">
    <h1 data-i18n="index.h1">DFMBA 한국 주택시장 101</h1>
    <div class="header-right">
      <!-- 탭: Overview + 6개 동인. 동인 탭 링크는 factors.js 가 data/drivers.json 을 읽어 채운다 -->
      <nav id="view-nav" aria-label="화면 이동" data-i18n-attr="aria-label:nav.aria">
        <a href="#overview" data-view="overview" aria-current="page" data-i18n="nav.overview">Overview</a>
        <a href="learn.html" data-page-link>부동산 기초</a>
        <a href="policies.html" data-page-link>정책 모니터</a>
      </nav>
      <div class="controls">
        <button id="theme-btn" type="button"><span class="ico" aria-hidden="true"></span><span class="lbl"></span></button>
      </div>
    </div>
  </header>

  <!--
    Overview: 6개 동인별 요약 타일 (3 x 2, 한 화면). 타일 순서·id 는 동인 탭과 같다.
    - 각 타일의 본문(<div class="tile-body" data-tile="동인 id">)은 factors.js 가 대표 지표 2개(서울 기준)로 채운다.
    - 대표 지표는 factors.js 의 HEADLINES 에서 바꾼다.
  -->
  <main class="tiles" id="view-overview">

    <section class="tile" id="tile-demand" aria-labelledby="tile-demand-title">
      <header class="tile-head"><h2 id="tile-demand-title"><a href="#demand">① 임차수요 압력</a></h2><span class="tile-scope">서울</span></header>
      <div class="tile-body" data-tile="demand"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

    <section class="tile" id="tile-supply" aria-labelledby="tile-supply-title">
      <header class="tile-head"><h2 id="tile-supply-title"><a href="#supply">② 주택공급·재고 여건</a></h2><span class="tile-scope">서울</span></header>
      <div class="tile-body" data-tile="supply"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

    <section class="tile" id="tile-finance" aria-labelledby="tile-finance-title">
      <header class="tile-head"><h2 id="tile-finance-title"><a href="#finance">③ 금융여건·상대가격</a></h2><span class="tile-scope">서울</span></header>
      <div class="tile-body" data-tile="finance"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

    <section class="tile" id="tile-rental" aria-labelledby="tile-rental-title">
      <header class="tile-head"><h2 id="tile-rental-title"><a href="#rental">④ 임대시장 수급·전환 구조</a></h2><span class="tile-scope">서울</span></header>
      <div class="tile-body" data-tile="rental"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

    <section class="tile" id="tile-trigger" aria-labelledby="tile-trigger-title">
      <header class="tile-head"><h2 id="tile-trigger-title"><a href="#trigger">⑤ 시장과열·단기 트리거</a></h2><span class="tile-scope">서울</span></header>
      <div class="tile-body" data-tile="trigger"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

    <section class="tile" id="tile-macro" aria-labelledby="tile-macro-title">
      <header class="tile-head"><h2 id="tile-macro-title"><a href="#macro">⑥ 거시경기·금융시장 여건</a></h2><span class="tile-scope">서울</span></header>
      <div class="tile-body" data-tile="macro"><p class="tile-placeholder" data-i18n="tile.placeholder">내용 준비 중</p></div>
    </section>

  </main>

  <!-- 동인 탭 화면: factors.js 가 선택한 동인의 설명과 변수 카드를 그린다 -->
  <main class="factor" id="view-factor" hidden></main>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/config.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/factors.js"></script>
</body>
</html>
