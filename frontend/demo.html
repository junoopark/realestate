<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="demo.title">API 연동 실습 — 부동산 지표 대시보드</title>
  <meta name="description" content="FastAPI 백엔드 API를 호출하고 결과를 보여주는 연동 실습 페이지" data-i18n-attr="content:demo.desc">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 data-i18n="demo.h1">API 연동 실습</h1>
    <div class="header-right">
      <nav aria-label="페이지 이동" data-i18n-attr="aria-label:nav.aria">
        <a href="index.html" data-i18n="nav.home">대시보드</a>
        <a href="demo.html" aria-current="page" data-i18n="nav.demo">API 연동 실습</a>
      </nav>
      <div class="controls">
        <button id="theme-btn" type="button"><span class="ico" aria-hidden="true"></span><span class="lbl"></span></button>
        <button id="lang-btn" type="button" data-i18n="lang.other" data-i18n-attr="aria-label:lang.aria">EN</button>
      </div>
    </div>
  </header>

  <main class="page">
    <p class="lead" data-i18n-html="demo.lead">
      이 페이지는 <strong>Vercel</strong>에 배포된 화면이 <strong>Render</strong>의 FastAPI 서버를 호출해 결과를 보여줍니다.
    </p>
    <p class="endpoint">
      <span data-i18n="demo.apiServer">API 서버:</span> <code id="api-base"></code> ·
      <a id="docs-link" href="#" target="_blank" rel="noopener">Swagger UI (/docs)</a>
    </p>

    <!-- 요청 상태 표시 (요청 중 / 성공 / 오류 / 서버 깨우는 중). 문구는 demo.js 가 채운다 -->
    <p id="status" class="status" role="status" aria-live="polite">준비됨</p>

    <section class="panel">
      <h2><span data-i18n="demo.p1.title">1. 서버 상태 확인</span> <span class="method">GET /health</span></h2>
      <button id="btn-health" type="button" data-i18n="demo.call">호출하기</button>
      <pre id="out-health" class="out" data-i18n="demo.out.empty" data-i18n-attr="aria-label:demo.out.healthAria">아직 호출하지 않았습니다.</pre>
    </section>

    <section class="panel">
      <h2><span data-i18n="demo.p2.title">2. 지표 목록</span> <span class="method">GET /indicators</span></h2>
      <button id="btn-list" type="button" data-i18n="demo.call">호출하기</button>
      <pre id="out-list" class="out" data-i18n="demo.out.empty" data-i18n-attr="aria-label:demo.out.listAria">아직 호출하지 않았습니다.</pre>
    </section>

    <section class="panel">
      <h2><span data-i18n="demo.p3.title">3. 지표 데이터</span> <span class="method">GET /indicators/{key}</span></h2>
      <form id="series-form" class="row">
        <label for="series-key" class="sr-only" data-i18n="demo.form.key">지표 key</label>
        <input id="series-key" name="key" required autocomplete="off" placeholder="hpi_seoul">
        <button type="submit" data-i18n="demo.call">호출하기</button>
      </form>
      <pre id="out-series" class="out" data-i18n="demo.out.empty" data-i18n-attr="aria-label:demo.out.seriesAria">아직 호출하지 않았습니다.</pre>
      <p class="hint" data-i18n="demo.hint">key 는 2번 지표 목록에서 확인할 수 있습니다.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p><a href="index.html" data-i18n="demo.back">← 대시보드로</a></p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/demo.js"></script>
</body>
</html>
