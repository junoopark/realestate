# 계열 정의 — 도시별 자료 선택을 여기서 명시한다 (설계서 8절)
#
# variable (표준 변수명)
#   price_index / price_index_national / rent_index        명목 지수 (원래 기준시점 그대로, 분석 단계에서 재지수화)
#   price_sqm (현지통화/㎡) · price_level (현지통화/호) · rent_month (현지통화/월) · rent_sqm_month (현지통화/㎡/월)
#   deposit_level (서울 월세 보증금, 원) · conversion_rate (전월세 전환율, %)
#   hh_income (가구 연소득) · earnings (근로자 개인 연소득) — income_concept 로 개념을 구분하고 섞지 않는다
#   rent_to_income_official (공식 통계가 직접 계산한 임대료 부담률, %)
#   cpi · fx_usd · ppp_private · gdp_nominal · household_credit_to_gdp (국가 단위, city_id: _national)
# quality_flag: A=정의·범위 일치 원자료 / B=공식이나 일부 불일치 또는 공개 민간 / C=추정·범위 불일치 큼
# scale: 원자료 단위 → unit 으로 바꾸는 곱수 (예: 천원→원 1000, 월→연 12)
# parse: 정제 함수가 쓰는 원자료 위치 정보

defaults:
  geography_type: city
  price_basis: nominal
  dwelling_type: ""
  tenure_type: ""
  area_basis: ""
  income_concept: ""
  quality_flag: B
  notes: ""
  method: ""

series:
  # ════════════════════════════ 서울 ════════════════════════════
  seoul_price_index:
    {city_id: seoul, country_code: KOR, variable: price_index, frequency: M, unit: index, currency: KRW,
     geography_name: 서울특별시, geography_code: "R-ONE 서울", dwelling_type: apartment, tenure_type: owner,
     source_id: kr_rone, source_url: "https://www.reb.or.kr/r-one/", series_code: A_2024_00045,
     method: "전국주택가격동향조사 아파트 매매가격지수", quality_flag: A,
     notes: "아파트만(서울 주택 재고의 일부). 기준시점은 원자료 그대로",
     parse: {table: A_2024_00045, region: 서울}}
  korea_price_index_national:
    {city_id: seoul, country_code: KOR, variable: price_index_national, frequency: M, unit: index, currency: KRW,
     geography_name: 전국, geography_code: "R-ONE 전국", geography_type: country, dwelling_type: apartment, tenure_type: owner,
     source_id: kr_rone, source_url: "https://www.reb.or.kr/r-one/", series_code: A_2024_00045,
     method: "전국주택가격동향조사 아파트 매매가격지수", quality_flag: A, parse: {table: A_2024_00045, region: 전국}}
  seoul_rent_index:
    {city_id: seoul, country_code: KOR, variable: rent_index, frequency: M, unit: index, currency: KRW,
     geography_name: 서울특별시, geography_code: "R-ONE 서울", dwelling_type: apartment, tenure_type: rent_monthly,
     source_id: kr_rone, source_url: "https://www.reb.or.kr/r-one/", series_code: A_2024_00055,
     method: "아파트 월세가격지수(2015.06~)", quality_flag: A,
     notes: "월세 유형만(준월세·준전세 제외, 부동산원 분류). 보증금 조정 여부는 부동산원 지수 산식에 따름 — 재조정하지 않음",
     parse: {table: A_2024_00055, region: 서울}}
  seoul_rent_index_combined:
    {city_id: seoul, country_code: KOR, variable: rent_index_alt, frequency: M, unit: index, currency: KRW,
     geography_name: 서울특별시, geography_code: "R-ONE 서울", dwelling_type: apartment, tenure_type: rent_monthly_all,
     source_id: kr_rone, source_url: "https://www.reb.or.kr/r-one/", series_code: A_2024_00054,
     method: "아파트 월세통합가격지수(월세+준월세+준전세)", quality_flag: A, parse: {table: A_2024_00054, region: 서울}}
  seoul_price_sqm_mean:
    {city_id: seoul, country_code: KOR, variable: price_sqm_survey, frequency: M, unit: KRW/sqm, currency: KRW, scale: 1000,
     geography_name: 서울특별시, dwelling_type: apartment, tenure_type: owner, area_basis: "단위면적(부동산원 평균단위매매가격)",
     source_id: kr_rone, source_url: "https://www.reb.or.kr/r-one/", series_code: A_2024_00061,
     method: "표본 아파트 평가가격 평균 ㎡단가 (천원/㎡ ×1000)", quality_flag: B,
     notes: "표본조사 평가가격(거래가 아님). 면적 기준(전용/공급)은 부동산원 통계설명 확인 대상",
     parse: {table: A_2024_00061, region: 서울}}
  seoul_price_level_mean:
    {city_id: seoul, country_code: KOR, variable: price_level_alt, frequency: M, unit: KRW, currency: KRW, scale: 1000,
     geography_name: 서울특별시, dwelling_type: apartment, tenure_type: owner, area_basis: 전체 면적,
     source_id: kr_rone, source_url: "https://www.reb.or.kr/r-one/", series_code: A_2024_00060,
     method: "표본 아파트 평균매매가격", quality_flag: B, parse: {table: A_2024_00060, region: 서울}}
  seoul_rent_month_mean:
    {city_id: seoul, country_code: KOR, variable: rent_month_cash_survey, frequency: M, unit: KRW/month, currency: KRW, scale: 1000,
     geography_name: 서울특별시, dwelling_type: apartment, tenure_type: rent_monthly_with_deposit, area_basis: 전체 면적,
     source_id: kr_rone, source_url: "https://www.reb.or.kr/r-one/", series_code: A_2024_00069,
     method: "표본 아파트 평균 월세가격(보증부 월세의 월 지급액, 보증금 별도)", quality_flag: B,
     notes: "보증금은 seoul_deposit_mean. 보증금 환산 전 현금 월세", parse: {table: A_2024_00069, region: 서울}}
  seoul_deposit_mean:
    {city_id: seoul, country_code: KOR, variable: deposit_level_survey, frequency: M, unit: KRW, currency: KRW, scale: 1000,
     geography_name: 서울특별시, dwelling_type: apartment, tenure_type: rent_monthly_with_deposit, area_basis: 전체 면적,
     source_id: kr_rone, source_url: "https://www.reb.or.kr/r-one/", series_code: A_2024_00068,
     method: "표본 아파트 평균 월세보증금", quality_flag: B, parse: {table: A_2024_00068, region: 서울}}
  seoul_conversion_rate:
    {city_id: seoul, country_code: KOR, variable: conversion_rate, frequency: M, unit: pct, currency: "",
     geography_name: 서울특별시, dwelling_type: apartment, tenure_type: rent_monthly_with_deposit,
     source_id: kr_rone, source_url: "https://www.reb.or.kr/r-one/", series_code: A_2024_00156,
     method: "아파트 전월세 전환율(관측치)", quality_flag: A,
     notes: "보증금 환산 기준 환산율로 사용 (법정 상한 아님)", parse: {table: A_2024_00156, region: 서울}}
  seoul_rtms_price_sqm:
    {city_id: seoul, country_code: KOR, variable: price_sqm, frequency: A, unit: KRW/sqm, currency: KRW,
     geography_name: 서울특별시(25개 구), dwelling_type: apartment, tenure_type: owner, area_basis: "전용 50~70㎡",
     source_id: kr_rtms, source_url: "https://www.data.go.kr/data/15126469/openapi.do", series_code: RTMSDataSvcAptTradeDev,
     method: "계약일 기준 연간 거래가/전용면적 중위값, 해제 건 제외", quality_flag: A,
     notes: "거래 구성(지역·면적·연식) 변화가 반영된 단순 중위값 — 순수 가격상승률이 아님",
     parse: {kind: apt_trade, stat: price_sqm}}
  seoul_rtms_price_level:
    {city_id: seoul, country_code: KOR, variable: price_level, frequency: A, unit: KRW, currency: KRW,
     geography_name: 서울특별시(25개 구), dwelling_type: apartment, tenure_type: owner, area_basis: "60㎡ 환산 (전용 50~70㎡ 중위 ㎡단가 × 60)",
     source_id: kr_rtms, source_url: "https://www.data.go.kr/data/15126469/openapi.do", series_code: RTMSDataSvcAptTradeDev,
     method: "중위 ㎡단가 × 60㎡", quality_flag: A, parse: {kind: apt_trade, stat: price_60}}
  seoul_rtms_rent_cash:
    {city_id: seoul, country_code: KOR, variable: rent_month_cash, frequency: A, unit: KRW/month, currency: KRW,
     geography_name: 서울특별시(25개 구), dwelling_type: apartment, tenure_type: rent_monthly_with_deposit, area_basis: "60㎡ 환산 (전용 50~70㎡ ㎡당 월세 중위 × 60)",
     source_id: kr_rtms, source_url: "https://www.data.go.kr/data/15126496/openapi.do", series_code: RTMSDataSvcAptRent,
     method: "월세>0 계약(보증부 월세 포함)의 ㎡당 현금 월세 중위 × 60. 보증금 환산 전", quality_flag: A,
     notes: "신규·갱신 포함. 신규만 집계한 값은 Seoul 보증금 시트 참고", parse: {kind: apt_rent, stat: rent_cash_60}}
  seoul_rtms_deposit:
    {city_id: seoul, country_code: KOR, variable: deposit_level, frequency: A, unit: KRW, currency: KRW,
     geography_name: 서울특별시(25개 구), dwelling_type: apartment, tenure_type: rent_monthly_with_deposit, area_basis: "60㎡ 환산 (전용 50~70㎡ ㎡당 보증금 중위 × 60)",
     source_id: kr_rtms, source_url: "https://www.data.go.kr/data/15126496/openapi.do", series_code: RTMSDataSvcAptRent,
     method: "월세>0 계약의 ㎡당 보증금 중위 × 60", quality_flag: A, parse: {kind: apt_rent, stat: deposit_60}}
  seoul_rtms_rent_converted:
    {city_id: seoul, country_code: KOR, variable: rent_month, frequency: A, unit: KRW/month, currency: KRW,
     geography_name: 서울특별시(25개 구), dwelling_type: apartment, tenure_type: rent_monthly_with_deposit, area_basis: "60㎡ 환산 (전용 50~70㎡)",
     source_id: kr_rtms, source_url: "https://www.data.go.kr/data/15126496/openapi.do", series_code: RTMSDataSvcAptRent,
     method: "계약별 (월세 + 보증금×기준환산율/12)/전용면적 의 중위 × 60. 기준환산율 = 그 해 R-ONE 서울 아파트 전월세 전환율 평균",
     quality_flag: B, notes: "환산율은 연구 가정. 민감도는 SeoulDeposit 시트", parse: {kind: apt_rent, stat: rent_converted_60}}
  seoul_hh_income:
    {city_id: seoul, country_code: KOR, variable: hh_income, frequency: A, unit: KRW/year, currency: KRW, scale: 10000,
     geography_name: 서울특별시, geography_type: city, income_concept: household_gross_current_income_mean,
     source_id: kr_kosis, source_url: "https://kosis.kr/statHtml/statHtml.do?orgId=101&tblId=INH_1HD_AAA01_01",
     series_code: INH_1HD_AAA01_01, method: "가계금융복지조사 전가구 평균 경상소득(전년도). 기간 = 소득연도(조사연도-1)",
     quality_flag: B, notes: "평균(중위 아님) — 다른 도시의 중위소득과 같은 순위표에 넣지 않는다. 경상소득은 세전",
     parse: {file: INH_1HD_AAA01_01, region: 서울특별시, item: 경상소득, lag: 1}}
  seoul_hh_income_median_est:
    {city_id: seoul, country_code: KOR, variable: hh_income_median_est, frequency: A, unit: KRW/year, currency: KRW, scale: 10000,
     geography_name: 서울특별시, income_concept: household_gross_current_income_median_ESTIMATE,
     source_id: kr_kosis, source_url: "https://kosis.kr/statHtml/statHtml.do?orgId=101&tblId=DT_1HDAAB03",
     series_code: "INH_1HD_AAA01_01 × DT_1HDAAB03", quality_flag: C,
     method: "추정: 서울 평균 경상소득 × (전국 소득구간 분포 보간 중위 ÷ 전국 평균). 시도별 중위는 공표되지 않음",
     notes: "서울의 평균/중위 비율이 전국과 같다는 가정 — 보조표에만 사용",
     parse: {file: INH_1HD_AAA01_01, region: 서울특별시, item: 경상소득, lag: 1, derive: median_estimate}}
  seoul_earnings:
    {city_id: seoul, country_code: KOR, variable: earnings, frequency: A, unit: KRW/year, currency: KRW, scale: 12,
     geography_name: 서울특별시(사업체 소재지), income_concept: employee_regular_monthly_wage_mean_x12,
     source_id: kr_kosis, source_url: "https://kosis.kr/statHtml/statHtml.do?orgId=101&tblId=DT_1YL15006",
     series_code: DT_1YL15006, method: "사업체노동력조사 상용근로자(5인 이상) 월평균 임금총액 × 12", quality_flag: B,
     notes: "근무지 기준·평균. 상용근로자만(임시·일용 제외)",
     parse: {file: DT_1YL15006, region: 서울특별시, item: 상용 월평균 임금}}

  # ════════════════════════════ 런던 ════════════════════════════
  london_price_index:
    {city_id: london, country_code: GBR, variable: price_index, frequency: M, unit: index, currency: GBP,
     geography_name: London (region), geography_code: E12000007, dwelling_type: all, tenure_type: owner,
     source_id: uk_hpi, source_url: "https://www.gov.uk/government/collections/uk-house-price-index-reports", series_code: "UK HPI London Index",
     method: "UK HPI (헤도닉, 등기 거래) 전체 유형", quality_flag: A, parse: {region: London, column: Index}}
  uk_price_index_national:
    {city_id: london, country_code: GBR, variable: price_index_national, frequency: M, unit: index, currency: GBP,
     geography_name: United Kingdom, geography_code: K02000001, geography_type: country, dwelling_type: all, tenure_type: owner,
     source_id: uk_hpi, source_url: "https://www.gov.uk/government/collections/uk-house-price-index-reports", series_code: "UK HPI United Kingdom Index",
     method: "UK HPI 전체 유형", quality_flag: A, parse: {region: United Kingdom, column: Index}}
  london_price_flat:
    {city_id: london, country_code: GBR, variable: price_level, frequency: M, unit: GBP, currency: GBP,
     geography_name: London (region), geography_code: E12000007, dwelling_type: flat_maisonette, tenure_type: owner, area_basis: "면적 미지정(플랫 전체)",
     source_id: uk_hpi, source_url: "https://www.gov.uk/government/collections/uk-house-price-index-reports", series_code: "UK HPI London FlatPrice",
     method: "UK HPI 플랫·메조네트 평균가격(헤도닉 기준가)", quality_flag: B,
     notes: "면적 정보가 없어 60㎡ 로 맞추지 않음", parse: {region: London, column: FlatPrice}}
  london_rent_flat:
    {city_id: london, country_code: GBR, variable: rent_month, frequency: M, unit: GBP/month, currency: GBP,
     geography_name: London (region), geography_code: E12000007, dwelling_type: flat_maisonette, tenure_type: rent_private, area_basis: "면적 미지정(플랫 전체)",
     source_id: uk_ons_pipr, source_url: "https://www.ons.gov.uk/economy/inflationandpriceindices/datasets/priceindexofprivaterentsukmonthlypricestatistics",
     series_code: "PIPR London Rental price flat maisonette", method: "ONS PIPR 민간임대 평균 월세(신규·기존 계약 포함), 플랫·메조네트",
     quality_flag: B, notes: "UK HPI 플랫 가격과 같은 주택유형 — 면적은 맞추지 못함",
     parse: {area: London, column: Rental price flat maisonette}}
  london_rent_all:
    {city_id: london, country_code: GBR, variable: rent_month_alt, frequency: M, unit: GBP/month, currency: GBP,
     geography_name: London (region), geography_code: E12000007, dwelling_type: all, tenure_type: rent_private,
     source_id: uk_ons_pipr, source_url: "https://www.ons.gov.uk/economy/inflationandpriceindices/datasets/priceindexofprivaterentsukmonthlypricestatistics",
     series_code: "PIPR London Rental price", method: "ONS PIPR 민간임대 평균 월세, 전체", quality_flag: B,
     parse: {area: London, column: Rental price}}
  london_rent_index:
    {city_id: london, country_code: GBR, variable: rent_index, frequency: M, unit: index, currency: GBP,
     geography_name: London (region), geography_code: E12000007, dwelling_type: all, tenure_type: rent_private,
     source_id: uk_ons_pipr, source_url: "https://www.ons.gov.uk/economy/inflationandpriceindices/datasets/priceindexofprivaterentsukmonthlypricestatistics",
     series_code: "PIPR London Index", method: "ONS PIPR (2015.01~, 2023.01=100)", quality_flag: A,
     parse: {area: London, column: Index}}
  london_earnings:
    {city_id: london, country_code: GBR, variable: earnings, frequency: A, unit: GBP/year, currency: GBP,
     geography_name: London (거주지 기준), geography_code: E12000007, income_concept: employee_fulltime_annual_gross_median,
     source_id: uk_nomis_ashe, source_url: "https://www.nomisweb.co.uk/datasets/asher", series_code: "NM_30_1 pay=7 item=2 sex=8",
     method: "ASHE 거주지 분석, 상근 근로자 연간 총급여 중위값", quality_flag: A,
     parse: {geography: London, sex: Full Time Workers, item: Median}}

  # ════════════════════════════ 홍콩 ════════════════════════════
  hk_price_index:
    {city_id: hong_kong, country_code: HKG, variable: price_index, frequency: A, unit: index, currency: HKD,
     geography_name: Hong Kong SAR, dwelling_type: private_domestic_all_classes, tenure_type: owner,
     source_id: hk_rvd, source_url: "https://www.rvd.gov.hk/en/publications/property_market_statistics.html", series_code: "his_data_4 All Classes",
     method: "RVD 민간주택 가격지수(전 등급, 1999=100) 연간", quality_flag: A, parse: {file: 4, kind: index, col: 26}}
  hk_rent_index:
    {city_id: hong_kong, country_code: HKG, variable: rent_index, frequency: A, unit: index, currency: HKD,
     geography_name: Hong Kong SAR, dwelling_type: private_domestic_all_classes, tenure_type: rent_private,
     source_id: hk_rvd, source_url: "https://www.rvd.gov.hk/en/publications/property_market_statistics.html", series_code: "his_data_3 All Classes",
     method: "RVD 민간주택 임대지수(전 등급, 1999=100) 연간", quality_flag: A, parse: {file: 3, kind: index, col: 26}}
  hk_price_sqm:
    {city_id: hong_kong, country_code: HKG, variable: price_sqm, frequency: A, unit: HKD/sqm, currency: HKD,
     geography_name: Hong Kong SAR (홍콩섬·구룡·신계 단순평균), dwelling_type: private_domestic_class_B, tenure_type: owner,
